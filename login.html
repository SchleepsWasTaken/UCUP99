<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - UCUP99</title>
<link rel="icon" href="/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* Style copied from client.pragmaticplay.com/en/login (see login-ref/) */
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font-family: Poppins, Helvetica, sans-serif; }
  .header { height: 80px; padding: 8px 24px; display: flex; align-items: center; }
  .header a { display: block; height: 100%; }
  .header img { height: 100%; width: auto; display: block; }
  .content { position: relative; overflow: hidden; min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .circle { position: absolute; background: #fff; opacity: .1; }
  .circle:first-child { width: 100vh; height: 100vh; border-radius: 50vh; animation: c1 60s linear infinite; }
  .circle:nth-child(2) { width: 150vh; height: 150vh; border-radius: 75vh; animation: c2 60s linear infinite; }
  @keyframes c1 { 0%,to { bottom: 0; right: -20vw } 25%,75% { bottom: 25vh; right: -18vw } 50% { bottom: 50vh; right: -16vw } }
  @keyframes c2 { 50% { left: -60vw; top: 30vh } 25%,75% { left: -58vw; top: 15vh } 0%,to { left: -54vw; top: 0 } }
  @media (prefers-reduced-motion: reduce) { .circle { animation: none; } }
  form { position: relative; z-index: 1; width: 100%; max-width: 450px; text-align: center; }
  h1 { color: #f19021; font-size: 24px; line-height: 32px; font-weight: 600; margin: 0; }
  p.desc { font-size: 16px; line-height: 24px; margin: 16px 0; }
  label { display: block; font-size: 14px; font-weight: 300; line-height: 22px; margin-top: 8px; }
  input { width: 100%; max-width: 320px; padding: 8px 12px; border: 0; border-radius: 12px; font: inherit; }
  .msg { color: #ff5c5c; min-height: 22px; font-size: 14px; margin-top: 8px; }
  .buttons { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  button { cursor: pointer; font: 14px/21px Poppins, Helvetica, sans-serif; padding: 6px 14px; border: 2px solid #f19021; border-radius: 12px; background: #f19021; color: #fff; transition: all .25s linear; }
  button.outline { background: transparent; }
  button:hover { opacity: .85; }
</style>
</head>
<body>
  <div class="header"><a href="/en/games/"><img src="/Logo.png" alt="UCUP99"></a></div>
  <div class="content">
    <div class="circle"></div>
    <div class="circle"></div>
    <form method="post" action="/login">
      <h1>Welcome!</h1>
      <p class="desc">Log in or create an account with a username and password.</p>
      <label for="u">Username</label>
      <input id="u" name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" title="Letters, numbers, underscore" autocomplete="username" value="<!--USER-->">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" required minlength="6" maxlength="128" autocomplete="current-password">
      <div class="msg" role="alert"><!--MSG--></div>
      <div class="buttons">
        <button type="submit">Log In</button>
        <button type="submit" class="outline" formaction="/register">Register</button>
      </div>
    </form>
  </div>
</body>
</html>
